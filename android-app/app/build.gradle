plugins { id 'com.android.application' }

android {
    lint {
        // targetSdk 28 is deliberate: it is the only way an app may exec binaries from its own
        // data directory on Android 10+, which is what a Termux bootstrap needs. Play would
        // reject this, but the APK is sideloaded anyway, and lint treats it as fatal.
        checkReleaseBuilds = false
        abortOnError = false
    }
    namespace 'com.vscode.android'
    compileSdk 36

    defaultConfig {
        applicationId 'com.vscode.android'
        minSdk 24
        targetSdk 28
        versionCode 3
        versionName '0.3.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Legacy packaging => the native libs are EXTRACTED to nativeLibraryDir,
    // which is the only app-writable path Android still allows execve from.
    packaging {
        jniLibs { useLegacyPackaging = true }
    }
    androidResources {
        // node_modules contains files aapt would otherwise mangle/compress
        noCompress += ['tar', 'zst', 'node', 'so', 'zip']
    }
}
